name: Deploy to AWS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: git -C ~/planning-poker pull origin main

      - name: Install dependencies
        run: npm ci --omit=dev
        working-directory: /home/ubuntu/planning-poker

      - name: Build
        run: npm run build
        working-directory: /home/ubuntu/planning-poker

      - name: Reload app
        run: pm2 reload ecosystem.config.js --env production
        working-directory: /home/ubuntu/planning-poker
